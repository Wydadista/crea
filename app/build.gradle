plugins { id 'com.android.application' }

android {
    namespace 'it.akhbar.post'
    compileSdk 35
    defaultConfig {
        applicationId 'it.akhbar.post'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
// No runtime libraries: only the Android SDK.
