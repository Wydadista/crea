<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'"
    />
    <title>AKhbar studio · Registratore</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #000;
        color: #eee;
        font:
          12px "Segoe UI",
          Arial;
        height: 76px;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px;
        -webkit-app-region: drag;
        overflow: hidden;
      }
      button,
      input {
        -webkit-app-region: no-drag;
      }
      label {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }
      input {
        width: 150px;
        padding: 8px;
        border: 1px solid #333;
        border-radius: 5px;
        background: #101010;
        color: white;
      }
      button {
        white-space: nowrap;
        padding: 9px 11px;
        border: 1px solid #333;
        border-radius: 5px;
        background: #171717;
        color: white;
        cursor: pointer;
      }
      button:hover {
        background: #292929;
      }
      button:disabled {
        opacity: 0.35;
        cursor: default;
      }
      #start {
        background: #b4ed70;
        color: #14220d;
        font-weight: 600;
      }
      #stop {
        background: #b73340;
      }
      #discard {
        margin-left: 20px;
        color: #ffb6ae;
      }
      #state {
        font: 21px monospace;
        width: 84px;
        text-align: center;
        flex-shrink: 0;
      }
      .meter {
        width: 95px;
        height: 12px;
        background: #202020;
        position: relative;
        overflow: hidden;
        border-radius: 3px;
        flex-shrink: 0;
      }
      #level {
        position: absolute;
        inset: 0;
        background: linear-gradient(90deg, #55d385 70%, #ffc82e 90%, #e04b4b);
        transform-origin: left;
        transform: scaleX(0);
      }
      #peak {
        position: absolute;
        top: 0;
        bottom: 0;
        width: 2px;
        background: white;
      }
      .window-button {
        padding: 8px;
        width: 28px;
        border: 0;
        background: transparent;
      }
      #close:hover {
        background: #b73340;
      }
      #window-controls {
        display: flex;
        margin-left: auto;
        gap: 1px;
      }
      body.compact {
        height: 64px;
        padding: 10px 14px;
        gap: 10px;
      }
      .compact label,
      .compact #start,
      .compact #settings {
        display: none;
      }
      .compact #state {
        order: 0;
        width: 105px;
        font-size: 22px;
      }
      .compact .meter {
        order: 1;
        width: 75px;
      }
      .compact #discard {
        order: 2;
        margin-left: 8px;
        font-size: 23px;
      }
      .compact #pause {
        order: 3;
        font-size: 20px;
      }
      .compact #stop {
        order: 4;
      }
      .compact > button {
        width: 44px;
        height: 42px;
        padding: 4px;
      }
      .compact #window-controls {
        order: 5;
      }
    </style>
  </head>
  <body>
    <label
      >Nome clip<input id="name" maxlength="128" placeholder="Registrazione"
    /></label>
    <div
      class="meter"
      role="meter"
      aria-label="Livello del microfono"
      aria-valuemin="0"
      aria-valuemax="100"
    >
      <span id="level"></span><span id="peak"></span>
    </div>
    <span id="state">00:00</span><button id="start">Inizia registrazione</button
    ><button id="pause" title="Pausa" aria-label="Pausa" disabled>⏸</button
    ><button id="stop" disabled>Stop</button
    ><button id="settings">Impostazioni</button
    ><button id="discard" disabled>Scarta</button>
    <div id="window-controls">
      <button id="minimize" class="window-button" aria-label="Riduci in icona">
        −</button
      ><button id="close" class="window-button" aria-label="Chiudi">×</button>
    </div>
    <script src="toolbar.js"></script>
  </body>
</html>
